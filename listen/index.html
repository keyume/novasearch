<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日听力</title>
<meta name="description" content="每天自动更新的英语听力：中高级公开播客的新单集，带变速、A-B 复读和断点续播。">
<meta name="theme-color" content="#F4F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1814" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日听力">
<style>
/* ---------- 色彩与尺寸 ---------- */
:root {
  --paper: #F4F6F1;
  --ink: #12261F;
  --muted: #56665E;
  --line: #D5DCD3;
  --accent: #0F4C3A;        /* 松绿：节目名、开关、主要按钮 */
  --on-accent: #EAF3EC;
  --lamp: #F2B632;          /* 信号灯黄：只用于播放键、指针、正在播放 */
  --lamp-ink: #2B2000;
  --notice: #FFF1CC;
  --danger: #A8321F;
  --sheet: #0F4C3A;         /* 播放页与迷你播放条的底色 */
  --on-sheet: #EAF3EC;
  --on-sheet-muted: #A9C9BA;
  --sheet-line: rgba(234, 243, 236, 0.22);

  --tabs-h: 56px;
  --mini-h: 64px;
  --rail-w: 216px;
  --sheet-w: 420px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0C1814;
    --ink: #E4ECE5;
    --muted: #94A79D;
    --line: #263A31;
    --accent: #7FCDAA;
    --on-accent: #0C1814;
    --notice: #3A2F0C;
    --danger: #F08A75;
    --sheet: #10382C;
  }
}

/* ---------- 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-bottom: calc(var(--tabs-h) + var(--safe-b));
  -webkit-font-smoothing: antialiased;
}
body.has-mini { padding-bottom: calc(var(--tabs-h) + var(--mini-h) + var(--safe-b)); }
h1, h2, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: 0.6; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.icon { display: inline-flex; }
.icon svg { display: block; fill: currentColor; }

/* ---------- 导航 ---------- */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--tabs-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--paper);
  border-top: 1px solid var(--line);
}
.brand { display: none; }
#tabs a {
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); text-decoration: none; font-weight: 600;
}
#tabs a span { padding: 6px 2px; border-bottom: 3px solid transparent; }
#tabs a[aria-current="page"] { color: var(--ink); }
#tabs a[aria-current="page"] span { border-bottom-color: var(--lamp); }

/* ---------- 内容区 ---------- */
#view { max-width: 720px; margin: 0 auto; padding: 0 20px 32px; }

.masthead { padding-top: 28px; }
.masthead-date {
  font-size: clamp(44px, 13vw, 68px); font-weight: 800; line-height: 1;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.masthead-weekday {
  margin-left: 12px; font-size: 0.34em; font-weight: 500; letter-spacing: 0; color: var(--muted);
}
.masthead-sub { margin: 12px 0 18px; color: var(--muted); }

.page-head { padding: 28px 0 4px; }
.page-head h1 { font-size: 30px; font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.page-sub { margin-top: 6px; color: var(--muted); }
.page-blurb { margin-top: 10px; max-width: 34em; }

.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.segmented button {
  min-height: 38px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted);
}
.segmented button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.notice {
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  margin-top: 20px; padding: 10px 14px; background: var(--notice); border-radius: 8px; font-size: 14px;
}
.notice button, .text-button {
  flex: none; min-height: 44px; padding: 0 6px; font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px;
}
.text-button { margin-left: 4px; }

.group { margin-top: 28px; }
.group-title {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 10px 0; background: var(--paper);
  font-size: 15px; font-weight: 700;
}
.group-count { font-size: 13px; font-weight: 400; color: var(--muted); }
.empty, .hint { color: var(--muted); max-width: 34em; }
.empty { padding: 36px 0; }
.hint { padding: 6px 0 10px; font-size: 14px; }

/* ---------- 单集行：节目单 ---------- */
.ep { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; border-top: 1px solid var(--line); }
.ep-main {
  display: grid; grid-template-columns: 4.4em minmax(0, 1fr); column-gap: 12px;
  width: 100%; padding: 14px 0; text-align: left;
}
.ep-lead { padding-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ep-body { display: block; min-width: 0; }
.ep-show { display: block; font-size: 13px; font-weight: 700; color: var(--accent); }
.ep-title { display: block; margin-top: 2px; font-size: 17px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.ep-meta { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); min-height: 1.5em; }
.ep-state:not(:empty) { margin-left: 12px; }
.ep-progress { display: block; height: 3px; max-width: 240px; margin-top: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.ep-progress-fill { display: block; height: 100%; background: var(--accent); }
.ep[data-done] .ep-title { color: var(--muted); }
.ep[data-current] .ep-lead { color: var(--ink); font-weight: 700; }
.ep[data-current] .ep-state { color: var(--ink); font-weight: 600; }
.ep[data-current] .ep-state::before {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
  border-radius: 50%; background: var(--lamp);
}
.ep-fav {
  display: grid; place-items: center; width: 44px; height: 44px; margin-top: 8px; color: var(--muted);
}
.ep-fav svg, .option .icon svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.ep-fav[aria-pressed="true"] { color: var(--ink); }
.ep-fav[aria-pressed="true"] svg, .option[aria-pressed="true"] .icon svg { fill: var(--lamp); stroke: var(--lamp); }

/* ---------- 节目库 ---------- */
.show { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; border-top: 1px solid var(--line); }
.show-main { display: block; width: 100%; padding: 14px 0; text-align: left; }
.show-title { display: block; font-size: 17px; font-weight: 600; line-height: 1.35; }
.show-meta { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.show-blurb { display: block; margin-top: 6px; font-size: 14px; }

.switch { position: relative; display: grid; place-items: center; width: 52px; height: 44px; cursor: pointer; }
.switch input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch-track {
  position: relative; width: 44px; height: 26px; border-radius: 999px;
  background: var(--line); transition: background 0.15s;
}
.switch-track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--paper); transition: transform 0.15s;
}
.switch input:checked + .switch-track { background: var(--accent); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 3px; }

.add-form { display: flex; gap: 10px; margin-top: 12px; }
.add-form input {
  flex: 1; min-width: 0; min-height: 46px; padding: 0 14px;
  background: transparent; border: 1px solid var(--muted); border-radius: 8px;
}
.add-form input::placeholder { color: var(--muted); }
.primary-button {
  flex: none; min-height: 46px; padding: 0 20px; border-radius: 8px;
  background: var(--accent); color: var(--on-accent); font-weight: 700;
}
.form-error { margin-top: 10px; color: var(--danger); font-size: 14px; }
.back-button {
  display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: 14px 0 -18px -6px;
  padding-right: 8px; color: var(--muted); font-weight: 600;
}

/* ---------- 我的 ---------- */
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 6px 0 18px; }
.figures dt { font-size: 13px; color: var(--muted); }
.figures dd { margin-top: 2px; font-size: 22px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 420px; }
.week li { display: grid; gap: 6px; justify-items: center; }
.week-track { display: flex; align-items: flex-end; width: 100%; height: 72px; border-bottom: 1px solid var(--line); }
.week-bar { display: block; width: 100%; min-height: 0; background: var(--line); border-radius: 3px 3px 0 0; }
.week li[data-met="true"] .week-bar { background: var(--accent); }
.week-day { font-size: 12px; color: var(--muted); }

/* ---------- 迷你播放条 ---------- */
#mini-player {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + var(--safe-b)); z-index: 11;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  height: var(--mini-h); padding: 0 8px 0 20px;
  background: var(--sheet); color: var(--on-sheet);
}
#mini-player :focus-visible, #player-sheet :focus-visible { outline-color: var(--lamp); }
.mini-progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--sheet-line); }
.mini-progress span { display: block; height: 100%; background: var(--lamp); }
.mini-main { display: block; min-width: 0; height: 100%; text-align: left; }
.mini-title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-show { display: block; font-size: 13px; color: var(--on-sheet-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-play { display: grid; place-items: center; width: 52px; height: 52px; }
.mini-play svg { width: 30px; height: 30px; }

/* ---------- 播放页 ---------- */
#player-sheet {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); color: var(--on-sheet);
  padding-bottom: calc(24px + var(--safe-b));
  animation: sheet-in 0.2s ease-out;
}
@keyframes sheet-in { from { transform: translateY(28px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  #player-sheet { animation: none; }
  .switch-track, .switch-track::after { transition: none; }
}
body.sheet-open { overflow: hidden; }
#player-sheet a { color: var(--lamp); }
.sheet-top { display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; }
.icon-button { display: grid; place-items: center; width: 44px; height: 44px; }
.sheet-show { min-width: 0; font-size: 14px; font-weight: 600; color: var(--on-sheet-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { max-width: 560px; margin: 0 auto; padding: 12px 24px 0; }
.sheet-head { display: flex; gap: 16px; align-items: flex-start; }
.sheet-cover { flex: none; width: 72px; height: 72px; border-radius: 6px; object-fit: cover; background: var(--sheet-line); }
.sheet-title { font-size: clamp(20px, 5.6vw, 26px); font-weight: 700; line-height: 1.28; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.sheet-error { margin-top: 16px; padding: 8px 14px; border: 1px solid var(--lamp); border-radius: 8px; font-size: 14px; }

/* 进度做成调谐刻度：每格一分钟（长节目每格五分钟），黄色指针是当前位置 */
.dial { position: relative; height: 56px; margin-top: 28px; border-bottom: 1px solid var(--on-sheet-muted); }
.dial-scale {
  position: absolute; inset: 0;
  background-image: linear-gradient(to right, var(--on-sheet-muted) 1px, transparent 1px);
  background-size: calc(100% / var(--ticks, 10)) 40%;
  background-position: left bottom; background-repeat: repeat-x;
  opacity: 0.7;
}
.dial-played { position: absolute; left: 0; bottom: 0; height: 40%; background: rgba(242, 182, 50, 0.22); }
.dial-ab {
  position: absolute; top: 0; bottom: 0; min-width: 2px;
  background: rgba(242, 182, 50, 0.3); border-left: 2px solid var(--lamp); border-right: 2px solid var(--lamp);
}
.dial-needle { position: absolute; top: 0; bottom: -1px; width: 2px; margin-left: -1px; background: var(--lamp); }
.dial-needle::before {
  content: ""; position: absolute; top: -5px; left: -5px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--lamp);
}
.dial input {
  position: absolute; inset: -8px 0; width: 100%; height: calc(100% + 16px); margin: 0;
  opacity: 0; cursor: pointer;
}
.dial:focus-within { outline: 2px solid var(--lamp); outline-offset: 6px; border-radius: 2px; }
.times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--on-sheet-muted); font-variant-numeric: tabular-nums; }

.transport { display: flex; align-items: center; justify-content: space-between; max-width: 380px; margin: 18px auto 0; }
.transport-button { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; }
.transport-button svg { width: 28px; height: 28px; }
.jump { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.transport-play {
  display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%;
  background: var(--lamp); color: var(--lamp-ink);
}
.transport-play svg { width: 36px; height: 36px; }
.transport-play:active, .mini-play:active, .transport-button:active { transform: scale(0.96); }

.options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 22px; }
.option {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  min-height: 44px; padding: 0 4px; border: 1px solid var(--sheet-line); border-radius: 999px;
  font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.option .icon svg { width: 18px; height: 18px; }
.option[aria-pressed="true"], .option[data-state="a"], .option[data-state="ab"] { border-color: var(--lamp); color: var(--lamp); }

.pane-tabs { display: flex; gap: 24px; margin-top: 28px; border-bottom: 1px solid var(--sheet-line); }
.pane-tabs button { min-height: 44px; padding: 0 2px; font-weight: 600; color: var(--on-sheet-muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.pane-tabs button[aria-selected="true"] { color: var(--on-sheet); border-bottom-color: var(--lamp); }
.prose { padding-top: 16px; font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.prose p { margin: 0 0 0.9em; max-width: 62ch; }
.prose ul, .prose ol { margin: 0 0 0.9em; padding-left: 1.4em; list-style: revert; }
.pane-status { color: var(--on-sheet-muted); }

/* ---------- 宽屏：左侧导航，播放页停靠在右侧 ---------- */
@media (min-width: 900px) {
  body { padding: 0 0 0 var(--rail-w); }
  body.has-mini { padding-bottom: var(--mini-h); }
  body.sheet-open { overflow: auto; padding-right: var(--sheet-w); }
  #tabs {
    top: 0; right: auto; width: var(--rail-w); height: auto;
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    padding: 28px 16px; border-top: 0; border-right: 1px solid var(--line);
  }
  .brand { display: block; padding: 0 12px 22px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  #tabs a { justify-content: flex-start; min-height: 44px; padding: 0 12px; border-radius: 8px; }
  #tabs a span { padding: 4px 0; }
  #view { padding: 12px 40px 48px; }
  #mini-player { left: var(--rail-w); bottom: 0; padding-left: 40px; }
  #player-sheet { left: auto; width: var(--sheet-w); animation: none; }
}
</style>
</head>
<body>
<nav id="tabs" aria-label="主导航">
  <div class="brand">每日听力</div>
  <a href="#/today" data-tab="today"><span>今日</span></a>
  <a href="#/shows" data-tab="shows"><span>节目</span></a>
  <a href="#/me" data-tab="me"><span>我的</span></a>
</nav>

<main id="view"></main>

<div id="mini-player" hidden></div>
<aside id="player-sheet" aria-label="播放页" hidden></aside>
<audio id="audio" preload="metadata"></audio>

<noscript><p style="padding:24px">这个应用需要启用 JavaScript。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
